    <text x="1006" y="216" text-anchor="middle" fill="#AEB2BC" font-family="Arial, sans-serif" font-size="22" font-weight="500">↻</text>

    <line x1="516" y1="276" x2="516" y2="406" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
    <line x1="764" y1="276" x2="764" y2="406" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>

    <text x="270" y="296" fill="#8E929D" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="7">TODAY</text>
    <text x="270" y="367" fill="#C97DF5" font-family="Arial, sans-serif" font-size="66" font-weight="700">$134</text>
    <text x="270" y="420" fill="#A8ACB5" font-family="Arial, sans-serif" font-size="28" font-weight="500">53.85M</text>

    <text x="564" y="296" fill="#8E929D" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="7">7 DAYS</text>
    <text x="564" y="367" fill="#FF7D9C" font-family="Arial, sans-serif" font-size="66" font-weight="700">$460</text>
    <text x="564" y="420" fill="#A8ACB5" font-family="Arial, sans-serif" font-size="28" font-weight="500">279M</text>

    <text x="812" y="296" fill="#8E929D" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="7">30 DAYS</text>
    <text x="812" y="367" fill="#FFB547" font-family="Arial, sans-serif" font-size="66" font-weight="700">$2.3K</text>
    <text x="812" y="420" fill="#A8ACB5" font-family="Arial, sans-serif" font-size="28" font-weight="500">1.53B</text>
  </g>

  <text x="220" y="570" fill="#F5F6FA" font-family="Arial, sans-serif" font-size="36" font-weight="800">Local Codex + Claude Code burn, made visceral.</text>
  <text x="220" y="616" fill="#C7CBD4" font-family="Arial, sans-serif" font-size="21" font-weight="500">Cool→warm cost ladder, panel-bound confetti on milestones, hover for per-provider breakdown.</text>
</svg>
