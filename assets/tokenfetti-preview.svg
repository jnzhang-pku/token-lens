  <text x="252" y="48" fill="#E7EBE2" font-family="Arial, sans-serif" font-size="19" font-weight="600">Edit</text>
  <text x="318" y="48" fill="#E7EBE2" font-family="Arial, sans-serif" font-size="19" font-weight="600">View</text>

  <rect y="76" width="1280" height="128" fill="url(#browser)"/>
  <rect x="72" y="110" width="174" height="36" rx="9" fill="#0F1712" fill-opacity="0.9"/>
  <rect x="270" y="110" width="174" height="36" rx="9" fill="#0F1712" fill-opacity="0.9"/>
  <rect x="468" y="110" width="174" height="36" rx="9" fill="#0F1712" fill-opacity="0.9"/>
  <rect x="666" y="110" width="174" height="36" rx="9" fill="#0F1712" fill-opacity="0.9"/>
  <rect x="864" y="110" width="174" height="36" rx="9" fill="#0F1712" fill-opacity="0.9"/>

  <path d="M514 24H766C766 47.7482 746.748 67 723 67H557C533.252 67 514 47.7482 514 24Z" fill="#05070B" stroke="white" stroke-opacity="0.1"/>
  <circle cx="640" cy="48" r="5" fill="#8B6CFF"/>

  <g filter="url(#panelShadow)">
    <rect x="220" y="148" width="840" height="336" rx="48" fill="#0F1320"/>
    <rect x="221" y="149" width="838" height="334" rx="47" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

    <!-- top-left: confetti-burst logo (radial 6 particles around violet center) -->
    <g transform="translate(274 208)">
      <circle r="3.2" fill="#8B6CFF"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#A08AFF"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#FF7D9C" transform="rotate(60)"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#FFD584" transform="rotate(120)"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#FFB547" transform="rotate(180)"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#FF8A55" transform="rotate(240)"/>
      <rect x="-2" y="-14" width="4" height="6" rx="1" fill="#C97DF5" transform="rotate(300)"/>
    </g>

    <!-- title centered in panel header -->
    <text x="640" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" letter-spacing="1.6"><tspan fill="url(#tokenMetal)" font-weight="500">token</tspan><tspan fill="#8B6CFF" font-weight="800">f</tspan><tspan fill="#FF7D9C" font-weight="800">e</tspan><tspan fill="#FFD584" font-weight="800">t</tspan><tspan fill="#A08AFF" font-weight="800">t</tspan><tspan fill="#FFB547" font-weight="800">i</tspan></text>

